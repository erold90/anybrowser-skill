<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>anybrowser — demo</title>
<style>
  :root{ --bg:#0b0f14; --card:#121821; --line:#243040; --ink:#e8edf3; --dim:#8fa3b8;
         --accent:#3ddc97; --accent2:#4ea1ff; --mono:"SF Mono",ui-monospace,Menlo,monospace;
         --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  *{box-sizing:border-box} html,body{height:100%}
  body{margin:0;background:radial-gradient(120% 90% at 80% -10%,#152233 0%,var(--bg) 55%);
       color:var(--ink);font:16px/1.5 var(--sans);display:grid;place-items:center;padding:28px}
  .card{width:min(560px,92vw);background:var(--card);border:1px solid var(--line);border-radius:16px;
        padding:34px 34px 28px;box-shadow:0 30px 80px -40px #000}
  .brand{display:flex;align-items:center;gap:10px;font:600 13px/1 var(--mono);letter-spacing:.14em;
         text-transform:uppercase;color:var(--dim);margin-bottom:22px}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--accent)}
  h1{font-size:26px;letter-spacing:-.02em;margin:0 0 4px} .sub{color:var(--dim);margin:0 0 26px;font-size:15px}
  label{display:block;font:600 12px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin:0 0 8px}
  .field{margin-bottom:18px}
  input,select{width:100%;background:#0d131b;border:1px solid var(--line);border-radius:10px;color:var(--ink);
        font-size:16px;padding:13px 14px;outline:none;transition:border-color .15s,box-shadow .15s}
  input:focus,select:focus{border-color:var(--accent2);box-shadow:0 0 0 3px #4ea1ff22}
  select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);
        background-position:calc(100% - 20px) 20px,calc(100% - 14px) 20px;background-size:6px 6px;background-repeat:no-repeat}
  button{width:100%;margin-top:8px;background:linear-gradient(180deg,var(--accent),#2bb87e);border:0;border-radius:10px;
        color:#052015;font:700 16px/1 var(--sans);padding:15px;cursor:pointer}
  .status{margin-top:20px;min-height:24px;font:600 14px/1.5 var(--mono);color:var(--dim)}
  .status.ok{color:var(--accent)}
  .badge{display:inline-block;margin-top:14px;font:600 12px/1 var(--mono);color:var(--dim);
        border:1px solid var(--line);border-radius:999px;padding:7px 12px}
  .badge b{color:var(--accent)}
</style></head>
<body>
  <form class="card" id="f" autocomplete="off">
    <div class="brand"><span class="dot"></span> anybrowser</div>
    <h1>Book a demo</h1>
    <p class="sub">One <code>do</code> call fills and submits this — with real, trusted input.</p>
    <div class="field"><label for="name">Name</label><input id="name" name="name" placeholder="Your name"></div>
    <div class="field"><label for="email">Email</label><input id="email" name="email" placeholder="you@company.com"></div>
    <div class="field"><label for="plan">Plan</label><select id="plan"><option>Free</option><option>Pro</option><option>Team</option></select></div>
    <button id="send" type="button">Send request</button>
    <div class="status" id="status">waiting for input…</div>
    <span class="badge" id="badge">real inputs: <b id="ri">0</b> · synthetic: <b id="si">0</b></span>
  </form>
<script>
  let ri=0, si=0;
  const $=id=>document.getElementById(id);
  for(const id of ['name','email']) $(id).addEventListener('input',e=>{ e.isTrusted?ri++:si++;
     $('ri').textContent=ri; $('si').textContent=si; });
  $('send').addEventListener('click',()=>{ $('status').textContent =
     `✓ Sent — ${$('name').value} · ${$('email').value} · ${$('plan').value}`; $('status').classList.add('ok'); });
</script>
</body></html>
