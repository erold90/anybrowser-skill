name: build

# The engine is a few Swift files. Compile it on Apple Silicon runners and run the
# commands that need no Accessibility permission (CI runners have none).
on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        # Apple Silicon runners; Intel is covered by local runs (tests/check.sh, tests/web.sh).
        os: [macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Compile
        run: |
          swiftc --version
          swiftc -O scripts/src/*.swift -o scripts/anybrowser
          file scripts/anybrowser
      - name: Commands that need no permission
        run: |
          scripts/anybrowser version
          scripts/anybrowser help | head -5
          scripts/anybrowser apps
          ! scripts/anybrowser open file:///etc/hosts
          ! scripts/anybrowser go javascript:alert(1)
          ! scripts/anybrowser shot ../x
          printf 'pos\n' | scripts/anybrowser do - || true
